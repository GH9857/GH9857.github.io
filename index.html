<!DOCTYPE html>
<html>
    <head>
            <title>Moody</title>
            <link rel="stylesheet" href="styles2.css">
            <script src="script2.js"></script>
    </head>
        
    <body>
        <h1>Hohoho~</h1>
        
        <aside></aside>
        <div class="mood-buttons">
            <button onclick="setMood('happy')">Happy 👯‍♂️</button>
            <button onclick="setMood('sad')">Sad 🫂</button>
            <button onclick="setMood('angry')">Angry 😀</button>
            <button onclick="setMood('calm')">Calm 🕴️</button>
            <button onclick="setMood('excited')">Excited 👀</button>
            <button onclick="setMood('tired')">Tired ☃︎</button>
        </div>
        
        <input type="text" id="nameInput" placeholder="Enter your name">
        <input type="text" id="moodInput" placeholder="Enter your mood">
        <button onclick="displayMood()">🫵</button>

        <h2 id="greeting" class="emoji"></h2>
    </body>
</html>
